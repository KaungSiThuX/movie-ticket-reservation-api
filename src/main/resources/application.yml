spring:
  application:
    name: movie-ticket-reservation

  datasource:
    url:

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        flushMode: COMMIT
    show:
      query: true

  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-description: "init"
    baseline-version: 0

  data:
    redis:
      url:

  cache:
    type: redis
    redis:
      time-to-live: 30m

  rabbitmq:
    addresses:
  jackson:
    mapper:
      allow-coercion-of-scalars: false

server:
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: "health,env,flyway,beans,metrics,mappings,prometheus"

access:
  token:
    exp: 900000

refresh:
  token:
    exp: 2592000000

cloudflare:
  r2:
    account_id:
    access-key:
    secret-key:
    endpoint:
    bucket-name:
    custom-domain:
    token:

google:
  client:
    id:
    secret:

resend:
  api:
    key:

stripe:
  secret:
    key:
  webhook:
    secret:
