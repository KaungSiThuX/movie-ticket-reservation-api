spring:
  application:
    name: movie-ticket-reservation

  datasource:
    url: ${DATASOURCE_URL}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        flushMode: COMMIT
    show:
      query: true

  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-description: "init"
    baseline-version: 0

  data:
    redis:
      url: ${REDIS_URL}

  cache:
    type: redis
    redis:
      time-to-live: 30m

  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES}

  jackson:
    mapper:
      allow-coercion-of-scalars: false

server:
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: "health,env,flyway,beans,metrics,mappings,prometheus"

access:
  token:
    exp: 900000

refresh:
  token:
    exp: 2592000000

cloudflare:
  r2:
    account_id: ${CLOUDFLARE_ACCOUNT_ID}
    access-key: ${CLOUDFLARE_ACCESS_KEY}
    secret-key: ${CLOUDFLARE_SECRET_KEY}
    endpoint: ${CLOUDFLARE_R2_ENDPOINT}
    bucket-name: ${CLOUDFLARE_BUCKET_NAME}
    custom-domain: ${CLOUDFLARE_CUSTOM_DOMAIN}
    token: ${CLOUDFLARE_TOKEN}

google:
  client:
    id: ${GOOGLE_CLIENT_ID}
    secret: ${GOOGLE_CLIENT_SECRET}

resend:
  api:
    key: ${RESEND_API_KEY}

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}